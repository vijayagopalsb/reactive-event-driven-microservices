# version: "3.9"

services:

  elasticsearch:
    image: elasticsearch:8.15.0
    container_name: elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - microservices-net

  logstash:
    image: logstash:8.15.0
    container_name: logstash
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "5044:5044"
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOST=http://elasticsearch:9200
    volumes:
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    networks:
      - microservices-net

  kibana:
    image: kibana:8.15.0
    container_name: kibana
    restart: unless-stopped
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - microservices-net

  # Step 1: single-node Kafka broker for local development.
  # Other containers connect to kafka:9092 on the shared Docker network.
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      # KRaft replaces ZooKeeper in this single-node development setup.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 12
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - microservices-net

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: api-gateway

    ports:
      - "8082:8082"
    depends_on:
      discovery-server:
        condition: service_healthy

    environment:
      SPRING_APPLICATION_NAME: api-gateway
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      JWT_PUBLIC_KEY: /run/secrets/jwt_public_key

      # REQUIRED FOR LOGGING STARTER
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000

    volumes:
      - ./secrets/jwt_public_key.pem:/run/secrets/jwt_public_key:ro

    networks:
      - microservices-net


  discovery-server:
    build:
      context: .
      dockerfile: Dockerfile.discovery
    container_name: discovery-server
    ports:
      - "8761:8761"
    environment:
      SPRING_APPLICATION_NAME: discovery-server
      SPRING_PROFILES_ACTIVE: docker

      # REQUIRED FOR LOGGING STARTER
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - microservices-net

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.auth
    container_name: auth-service
    ports:
      - "9090:9090"
    depends_on:
      discovery-server:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: auth-service
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_KAFKA_TOPICS_USER_LOGGED_IN: auth.login-succeeded.v1
      APP_KAFKA_TOPICS_LOGIN_FAILED: auth.login-failed.v1

      # REQUIRED FOR LOGGING STARTER
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000

    volumes:
      - ./secrets/jwt_private_key.pem:/run/secrets/jwt_private_key
      - ./secrets/jwt_public_key.pem:/run/secrets/jwt_public_key

    networks:
      - microservices-net

  audit-service:
    build:
      context: .
      dockerfile: Dockerfile.audit
    container_name: audit-service
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: audit-service
      SPRING_PROFILES_ACTIVE: docker
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_CONSUMER_GROUP_ID: audit-service
      APP_KAFKA_TOPICS_USER_LOGGED_IN: auth.login-succeeded.v1
      APP_KAFKA_TOPICS_LOGIN_FAILED: auth.login-failed.v1
    networks:
      - microservices-net

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: reactive_auth_db
    ports:
      - "3307:3306"   # FIXED: expose MySQL on 3307 instead of 3306
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - microservices-net

  redis:
    image: redis:7.4-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge

volumes:
  mysql_data:
  elasticsearch_data:
  kafka_data:
