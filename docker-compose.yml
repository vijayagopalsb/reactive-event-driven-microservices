# version: "3.9"

services:

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: api-gateway

    ports:
      - "8082:8082"
    depends_on:
      discovery-server:
        condition: service_healthy

    environment:
      SPRING_APPLICATION_NAME: api-gateway
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/

      # REQUIRED FOR LOGGING STARTER
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000

    networks:
      - microservices-net


  discovery-server:
    build:
      context: .
      dockerfile: Dockerfile.discovery
    container_name: discovery-server
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker

      # REQUIRED FOR LOGGING STARTER
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - microservices-net

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.auth
    container_name: auth-service
    ports:
      - "9090:9090"
    depends_on:
      - discovery-server
    environment:
      SPRING_APPLICATION_NAME: auth-service
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/

      # REQUIRED FOR LOGGING STARTER
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000

    volumes:
      - ./secrets/jwt_private_key.pem:/run/secrets/jwt_private_key
      - ./secrets/jwt_public_key.pem:/run/secrets/jwt_public_key

    networks:
      - microservices-net

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: reactive_auth_db
    ports:
      - "3307:3306"   # FIXED: expose MySQL on 3307 instead of 3306
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge

volumes:
  mysql_data:

